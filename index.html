<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;

            font-size: 1.1em;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        a {
            padding: 12px 30px;

            text-decoration: none;
            font-weight: bold;
            font-size: 1em;

        .btn-login {
            background: #007bff;
            color: white;
        }
        .btn-login:hover {
            background: #0056b3;
            transform: translateY(-2px);

        .btn-register {

            color: white;
