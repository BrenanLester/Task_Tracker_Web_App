<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebugMyDay — Login / Registration</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="form-box login">
            <form id="loginForm" action="src/Authentication/login.php" method="POST">
                <h1>Login</h1>
                <div class="input-box">
                    <input id="login-email" name="email" type="email" placeholder="Email" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input id="login-password" name="password" type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>
                <button id="loginBtn" type="submit" class="btn">Login</button>
                <p class="form-note">or login with social platforms</p>
                <div class="social-icons">
                    <a href="https://accounts.google.com/" target="_blank">
                        <i class='bx bxl-google'></i>
                    </a>
                    <a href="https://www.facebook.com/login.php" target="_blank">
                        <i class='bx bxl-facebook'></i>
                    </a>
                    <a href="https://github.com/login" target="_blank">
                        <i class='bx bxl-github'></i>
                    </a>
                    <a href="https://www.linkedin.com/login" target="_blank">
                        <i class='bx bxl-linkedin'></i>
                    </a>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <form id="registerForm" action="src/Authentication/register.php" method="POST">
                <h1>Registration</h1>
                <div class="input-box">
                    <input id="reg-name" name="name" type="text" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input id="reg-email" name="email" type="email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input id="reg-password" name="password" type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button id="regBtn" type="submit" class="btn">Register</button>
                <p class="form-note">or register with social platforms</p>
                <div class="social-icons">
                    <a href="https://accounts.google.com/" target="_blank">
                        <i class='bx bxl-google'></i>
                    </a>
                    <a href="https://www.facebook.com/login.php" target="_blank">
                        <i class='bx bxl-facebook'></i>
                    </a>
                    <a href="https://github.com/login" target="_blank">
                        <i class='bx bxl-github'></i>
                    </a>
                    <a href="https://www.linkedin.com/login" target="_blank">
                        <i class='bx bxl-linkedin'></i>
                    </a>
                </div>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Display error or success message if present in URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const success = urlParams.get('success');

        if (error) {
            const loginForm = document.getElementById('loginForm');
            const errorDiv = document.createElement('p');
            errorDiv.style.color = 'red';
            errorDiv.style.marginBottom = '10px';
            errorDiv.style.textAlign = 'center';
            errorDiv.textContent = error;
            loginForm.insertBefore(errorDiv, loginForm.firstChild.nextSibling);

            // Remove error from URL without reloading
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        if (success) {
            const loginForm = document.getElementById('loginForm');
            const successDiv = document.createElement('p');
            successDiv.style.color = 'green';
            successDiv.style.marginBottom = '10px';
            successDiv.style.textAlign = 'center';
            successDiv.textContent = success;
            loginForm.insertBefore(successDiv, loginForm.firstChild.nextSibling);

            // Remove success from URL without reloading
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>

</html>
