<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

  <!-- SIDEBAR -->
<div class="sidebar">
    <h5 class="fw-bold mb-4">DebugMyDay</h5>

    <a class="menu-item active" href="dashboard.html">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a class="menu-item" href="tasks.html">
        <i class="bi bi-list-check"></i> Tasks
    </a>

    <a class="menu-item" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
    <a class="menu-item" href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro Timer</a>
    <a class="menu-item" href="settings.html"><i class="bi bi-gear-fill"></i> Settings</a>
    <a class="menu-item" href="aboutus.html"><i class="bi bi-info-circle"></i> About Us</a>

    <a class="menu-item" href="#"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

  <!-- Main Content -->
  <div class="content" id="content">
    <h2 class="fw-semibold">Hello, [Username Here]! 👋</h2>
    <p class="text-muted">Here's your productivity overview</p>

    <div class="row mt-3 g-3">
      <div class="col-md-4">
        <div class="card-metric">
          <h6>Total Tasks</h6>
          <h2 class="fw-bold">—</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-metric">
          <h6>Pending Tasks</h6>
          <h2 class="fw-bold text-warning">—</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-metric">
          <h6>Completed Tasks</h6>
          <h2 class="fw-bold text-success">—</h2>
        </div>
      </div>
    </div>

    <div class="row mt-4 g-4">
      <div class="col-lg-6">
        <div class="calendar-box">
          <h5 class="mb-3">Recent Activity</h5>
          <ul class="list-group">
            <!-- Items go here -->
          </ul>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="calendar-box">
          <h5 class="mb-3">Calendar</h5>
          <div id="fullcalendar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="dashboard.js"></script>

</body>
</html>
